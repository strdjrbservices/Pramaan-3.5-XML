worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp directories in /tmp for non-root execution
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    access_log /tmp/nginx_access.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow up to 100MB file uploads (appraisal PDFs / XMLs)
    client_max_body_size 100M;

    # Gzip compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        # Hugging Face Spaces port
        listen 7860;
        server_name _;

        # Root directory for frontend SPA
        root /app/frontend_build;
        index index.html;

        # 1. Reverse proxy Django API and admin routes
        location ~ ^/(api|admin|token)/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 2. Static files (Django collected static + React assets)
        location /static/ {
            alias /app/backend/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 3. Media files
        location /media/ {
            alias /app/backend/media/;
            expires 7d;
        }

        # 4. React Single Page Application (SPA) routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

